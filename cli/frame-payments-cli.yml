credentials:
  path: ~/.config/frame/credentials.json
  mode: '0600'
  storage: OS keychain (keytar)
commands:
  - name: frame login
    description: Authenticate with your Frame sandbox API key.
  - name: frame logout
    description: Remove the stored Frame credential.
  - name: frame whoami
    description: Show the currently authenticated merchant.
  - name: frame listen
    description: Forward sandbox webhook events to a local URL.
    flags: ['--forward-to <url>']
  - name: frame events resend <evt_id>
    description: Re-deliver a previously emitted event verbatim.
  - name: frame open [page]
