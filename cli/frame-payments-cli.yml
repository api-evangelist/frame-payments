scope: sandbox-only
summary: >-
  Sandbox-only developer CLI. Simulate payments and forward webhook events to a
  local server against the Frame sandbox without touching live keys. Live API
  keys are rejected at runtime; every command prints a `mode: sandbox` banner.
install:
  - method: homebrew
    command: brew install Frame-Payments/tap/frame
  - method: homebrew-tap
    command: brew tap Frame-Payments/tap && brew install frame
