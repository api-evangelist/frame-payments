aid: frame-payments
name: Frame Payments
description: >-
  Frame Payments is a payments and compliance platform ("operating system") for
  high-compliance and high-risk merchants across regulated verticals including
  travel, crypto, telemedicine, gaming, gambling, the creator economy, and AI
  businesses. The frameOS platform unifies payments, payouts, KYC/KYB, identity
  verification, fraud detection (Sonar), geocompliance, disputes, subscriptions,
  and usage-based billing behind one REST API at api.framepayments.com/v1. Frame
  ships backend SDKs (Node, PHP, Ruby), mobile SDKs (iOS, Android, React Native),
  the Frame.js browser SDK with embeddable elements, a sandbox-only CLI, and
  HMAC-signed webhooks. Backed by Techstars.
